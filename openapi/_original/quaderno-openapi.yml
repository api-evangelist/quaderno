      responses:
        '200':
          description: The requested checkout session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks.json:
    get:
      operationId: listWebhooks
      tags:
        - Webhooks
      summary: List webhooks
      responses:
        '200':
          description: A list of webhook subscriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWebhook
      tags:
        - Webhooks
      summary: Create a webhook
      description: >-
        Subscribes a URL to real-time event notifications. Quaderno POSTs a
        JSON payload over HTTPS when subscribed events occur and retries hourly
        (up to 72 hours) if the endpoint does not respond with a 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '201':
          description: The created webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '422':
          $ref: '#/components/responses/ValidationError'
  /webhooks/{id}.json:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getWebhook
      tags:
        - Webhooks
      summary: Retrieve a webhook
      responses:
        '200':
          description: The requested webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateWebhook
      tags:
        - Webhooks
      summary: Update a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '200':
          description: The updated webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhook
      tags:
        - Webhooks
      summary: Delete a webhook
      responses:
        '204':
          description: The webhook subscription was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /evidences.json:
    get:
      operationId: listEvidences
      tags:
        - Evidences
      summary: List evidences
      description: Lists location evidence records supporting tax determination.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of evidence records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic Authentication. Use your private API key as the username;
        the password can be any value. API keys are managed in the Quaderno
        account settings.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The unique ID of the resource.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number for paginated results (25 records per page).
      schema:
        type: integer
        default: 1
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties: true
    DocumentItem:
      type: object
      description: A line item on a document.
      properties:
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        discount_rate:
          type: number
        tax_1_name:
          type: string
        tax_1_rate:
          type: number
        tax_code:
          type: string
        reference:
          type: string
    ContactInput:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - company
            - person
          description: Whether the contact is a company or a person.
        first_name:
          type: string
        last_name:
          type: string
        contact_name:
          type: string
        street_line_1:
          type: string
        city:
          type: string
        postal_code:
          type: string
        region:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        email:
          type: string
        tax_id:
          type: string
    Contact:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
        - type: object
          properties:
            id:
              type: string
            full_name:
              type: string
            created_at:
              type: integer
    ItemInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        code:
          type: string
        unit_cost:
          type: number
        tax_code:
          type: string
        stock:
          type: integer
    Item:
      allOf:
        - $ref: '#/components/schemas/ItemInput'
        - type: object
          properties:
            id:
              type: string
    InvoiceInput:
      type: object
      required:
        - contact_id
      properties:
        contact_id:
          type: string
        contact:
          $ref: '#/components/schemas/ContactInput'
        po_number:
          type: string
        currency:
          type: string
          description: ISO 4217 currency code.
        tag_list:
          type: string
        payment_method:
          type: string
        items_attributes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        notes:
          type: string
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceInput'
        - type: object
          properties:
            id:
              type: string
            number:
              type: string
            issue_date:
              type: string
            state:
              type: string
            subtotal:
              type: number
            taxes:
              type: number
            total:
              type: number
            payments:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
            permalink:
              type: string
    CreditInput:
      type: object
      required:
        - contact_id
      properties:
        contact_id:
          type: string
        invoice_id:
          type: string
          description: The invoice this credit note is issued against.
        currency:
          type: string
        items_attributes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        notes:
          type: string
    Credit:
      allOf:
        - $ref: '#/components/schemas/CreditInput'
        - type: object
          properties:
            id:
              type: string
            number:
              type: string
            issue_date:
              type: string
            total:
              type: number
    EstimateInput:
      type: object
      required:
        - contact_id
      properties:
        contact_id:
          type: string
        contact:
          $ref: '#/components/schemas/ContactInput'
        currency:
          type: string
        po_number:
          type: string
        items_attributes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        notes:
          type: string
    Estimate:
      allOf:
        - $ref: '#/components/schemas/EstimateInput'
        - type: object
          properties:
            id:
              type: string
            number:
              type: string
            issue_date:
              type: string
            state:
              type: string
            total:
              type: number
    ExpenseInput:
      type: object
      required:
        - contact_id
      properties:
        contact_id:
          type: string
        contact:
          $ref: '#/components/schemas/ContactInput'
        currency:
          type: string
        payment_method:
          type: string
        items_attributes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        notes:
          type: string
    Expense:
      allOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - type: object
          properties:
            id:
              type: string
            number:
              type: string
            issue_date:
              type: string
            total:
              type: number
    RecurringInput:
      type: object
      required:
        - contact_id
        - period
        - frequency
      properties:
        contact_id:
          type: string
        currency:
          type: string
        period:
          type: integer
          description: Interval count between generated documents.
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - monthly
            - yearly
        start_date:
          type: string
        end_date:
          type: string
        items_attributes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
    Recurring:
      allOf:
        - $ref: '#/components/schemas/RecurringInput'
        - type: object
          properties:
            id:
              type: string
    PaymentInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
        payment_method:
          type: string
          enum:
            - credit_card
            - cash
            - wire_transfer
            - direct_debit
            - check
            - paypal
            - other
        date:
          type: string
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentInput'
        - type: object
          properties:
            id:
              type: string
    TransactionInput:
      type: object
      required:
        - customer
        - items
      properties:
        customer:
          type: object
          description: Customer identity and location details used for tax determination.
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            country:
              type: string
            postal_code:
              type: string
            region:
              type: string
            tax_id:
              type: string
        items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              quantity:
                type: number
              unit_price:
                type: number
              tax_code:
                type: string
        payment_method:
          type: string
        evidence:
          type: object
          additionalProperties: true
    Transaction:
      allOf:
        - $ref: '#/components/schemas/TransactionInput'
        - type: object
          properties:
            id:
              type: string
            total:
              type: number
            taxes:
              type: number
    TaxCalculation:
      type: object
      properties:
        country:
          type: string
        region:
          type: string
        county:
          type: string
        city:
          type: string
        name:
          type: string
          description: Human-readable tax name (for example VAT, GST, Sales Tax).
        rate:
          type: number
        tax_behavior:
          type: string
        notes:
          type: string
        status:
          type: string
          enum:
            - taxable
            - non_taxable
            - not_registered
          description: Reasoning for the calculated rate.
    TaxJurisdiction:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
        region:
          type: string
    TaxCode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    CheckoutSessionInput:
      type: object
      properties:
        success_url:
          type: string
        cancel_url:
          type: string
        currency:
          type: string
        customer:
          $ref: '#/components/schemas/ContactInput'
        items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              quantity:
                type: number
              unit_price:
                type: number
              tax_code:
                type: string
    CheckoutSession:
      allOf:
        - $ref: '#/components/schemas/CheckoutSessionInput'
        - type: object
          properties:
            id:
              type: string
            url:
              type: string
            status:
              type: string
    WebhookInput:
      type: object
      required:
        - url
        - events_types
      properties:
        url:
          type: string
          format: uri
        events_types:
          type: array
          description: >-
            Event types to subscribe to (for example invoice.created,
            invoice.updated, checkout.succeeded, checkout.failed,
            checkout.abandoned).
          items:
            type: string
    Webhook:
      allOf:
        - $ref: '#/components/schemas/WebhookInput'
        - type: object
          properties:
            id:
              type: string
    Evidence:
      type: object
      properties:
        id:
          type: string
        billing_country:
          type: string
        ip_address:
          type: string
        bank_country:
          type: string
        evidence_type:
          type: string
