openapi: 3.2.0
info:
  title: Quaderno Recurring API
  description: The Quaderno API is a REST API for tax compliance, invoicing, and sales tax / VAT automation.
  version: '1.0'
  contact:
    name: Quaderno
    url: https://developers.quaderno.io
  license:
    name: Proprietary
    url: https://quaderno.io/terms/
servers:
- url: https://{account}.quadernoapp.com/api
  description: Production (account-scoped)
  variables:
    account:
      default: ACCOUNT_NAME
      description: Your Quaderno account subdomain.
security:
- basicAuth: []
tags:
- name: Recurring
  description: Recurring document templates that auto-generate invoices.
paths:
  /recurring.json:
    get:
      operationId: listRecurring
      tags:
      - Recurring
      summary: List recurring documents
      parameters:
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of recurring documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recurring'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createRecurring
      tags:
      - Recurring
      summary: Create a recurring document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringInput'
      responses:
        '201':
          description: The created recurring document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurring'
        '422':
          $ref: '#/components/responses/ValidationError'
  /recurring/{id}.json:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getRecurring
      tags:
      - Recurring
      summary: Retrieve a recurring document
      responses:
        '200':
          description: The requested recurring document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurring'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRecurring
      tags:
      - Recurring
      summary: Update a recurring document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringInput'
      responses:
        '200':
          description: The updated recurring document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurring'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteRecurring
      tags:
      - Recurring
      summary: Delete a recurring document
      responses:
        '204':
          description: The recurring document was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties: true
    DocumentItem:
      type: object
      description: A line item on a document.
      properties:
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        discount_rate:
          type: number
        tax_1_name:
          type: string
        tax_1_rate:
          type: number
        tax_code:
          type: string
        reference:
          type: string
    Recurring:
      allOf:
      - $ref: '#/components/schemas/RecurringInput'
      - type: object
        properties:
          id:
            type: string
    RecurringInput:
      type: object
      required:
      - contact_id
      - period
      - frequency
      properties:
        contact_id:
          type: string
        currency:
          type: string
        period:
          type: integer
          description: Interval count between generated documents.
        frequency:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - yearly
        start_date:
          type: string
        end_date:
          type: string
        items_attributes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number for paginated results (25 records per page).
      schema:
        type: integer
        default: 1
    Id:
      name: id
      in: path
      required: true
      description: The unique ID of the resource.
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your private API key as the username; the password can be any value. API keys are managed in the Quaderno account settings.
