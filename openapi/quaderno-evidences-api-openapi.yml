openapi: 3.2.0
info:
  title: Quaderno Evidences API
  description: The Quaderno API is a REST API for tax compliance, invoicing, and sales tax / VAT automation.
  version: '1.0'
  contact:
    name: Quaderno
    url: https://developers.quaderno.io
  license:
    name: Proprietary
    url: https://quaderno.io/terms/
servers:
- url: https://{account}.quadernoapp.com/api
  description: Production (account-scoped)
  variables:
    account:
      default: ACCOUNT_NAME
      description: Your Quaderno account subdomain.
security:
- basicAuth: []
tags:
- name: Evidences
  description: Location evidence records supporting tax determination for a transaction.
paths:
  /evidences.json:
    get:
      operationId: listEvidences
      tags:
      - Evidences
      summary: List evidences
      description: Lists location evidence records supporting tax determination.
      parameters:
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of evidence records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    Evidence:
      type: object
      properties:
        id:
          type: string
        billing_country:
          type: string
        ip_address:
          type: string
        bank_country:
          type: string
        evidence_type:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties: true
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number for paginated results (25 records per page).
      schema:
        type: integer
        default: 1
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your private API key as the username; the password can be any value. API keys are managed in the Quaderno account settings.
