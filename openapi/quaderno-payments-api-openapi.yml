openapi: 3.2.0
info:
  title: Quaderno Payments API
  description: The Quaderno API is a REST API for tax compliance, invoicing, and sales tax / VAT automation.
  version: '1.0'
  contact:
    name: Quaderno
    url: https://developers.quaderno.io
  license:
    name: Proprietary
    url: https://quaderno.io/terms/
servers:
- url: https://{account}.quadernoapp.com/api
  description: Production (account-scoped)
  variables:
    account:
      default: ACCOUNT_NAME
      description: Your Quaderno account subdomain.
security:
- basicAuth: []
tags:
- name: Payments
  description: Payments recorded against invoices, credits, and expenses.
paths:
  /invoices/{id}/payments.json:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: createInvoicePayment
      tags:
      - Payments
      summary: Add a payment to an invoice
      description: Records a payment against the invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: The created payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invoices/{id}/payments/{payment_id}.json:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: payment_id
      in: path
      required: true
      description: The ID of the payment.
      schema:
        type: string
    delete:
      operationId: deleteInvoicePayment
      tags:
      - Payments
      summary: Remove a payment from an invoice
      responses:
        '204':
          description: The payment was removed.
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Payment:
      allOf:
      - $ref: '#/components/schemas/PaymentInput'
      - type: object
        properties:
          id:
            type: string
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          additionalProperties: true
    PaymentInput:
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
        payment_method:
          type: string
          enum:
          - credit_card
          - cash
          - wire_transfer
          - direct_debit
          - check
          - paypal
          - other
        date:
          type: string
  responses:
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The unique ID of the resource.
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Use your private API key as the username; the password can be any value. API keys are managed in the Quaderno account settings.
