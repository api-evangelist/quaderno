aid: quaderno
url: https://raw.githubusercontent.com/api-evangelist/quaderno/refs/heads/main/apis.yml
name: Quaderno
kind: company
description: Quaderno is a tax compliance, invoicing, and sales-tax / VAT automation
  platform. Its REST API calculates the correct sales tax, VAT, and GST in real time
  for any jurisdiction, then issues tax-compliant invoices, credit notes, estimates,
  and receipts. The account-scoped API (https://ACCOUNT_NAME.quadernoapp.com/api)
  covers contacts, items, invoices, credits, estimates, expenses, recurring
  documents, payments, unified sales transactions, hosted Checkout sessions, and
  webhooks, plus a tax engine for rate calculation, jurisdictions, tax codes, and
  tax ID validation. Requests use HTTP Basic Auth with a private API key and return
  JSON; every endpoint path ends in .json.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Tax Compliance
- Sales Tax
- VAT
- Invoicing
- Billing
- FinTech
