meters:
- name: subscription_tier
  description: Flat monthly subscription fee for the selected plan tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: transactions
  description: Number of transactions (issued documents) processed per month against the plan allowance.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - plan
- name: tax_jurisdictions
  description: Number of tax jurisdictions the account is registered and filing in, which factors into tier selection.
  unit: jurisdictions
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track monthly transaction counts against the plan allowance and monitor how many jurisdictions are active.
- name: Allocation
  description: Attribute the flat subscription and transaction usage to the products, channels, or entities generating the sales documents.
- name: Optimization
  description: Right-size the plan tier to actual monthly transaction volume; consolidate low-volume channels to avoid an oversized tier, and negotiate Enterprise terms above the Growth allowance.
- name: Accountability
  description: Assign an owner to review transaction volume vs. allowance each month and to reconcile tier price and jurisdiction coverage against the pricing page.
