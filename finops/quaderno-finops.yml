description: >-
  FinOps view of Quaderno spend. Quaderno bills a flat monthly subscription
  priced by tier (Startup, Business, Growth, Enterprise), with the dominant cost
  driver being the number of transactions processed per month and the number of
  tax jurisdictions covered. API access and Quaderno Checkout are included in the
  subscription at no metered per-call cost, so cost management centers on
  choosing the right transaction-allowance tier and avoiding overage rather than
  on API call volume.
notes: >-
  Per-tier prices and transaction allowances are not reconciled here; verify on
  https://quaderno.io/pricing/. The API rate limit (100 requests per 15 seconds)
  governs throughput but does not itself incur charges - billing tracks processed
  documents/transactions, not API requests.
